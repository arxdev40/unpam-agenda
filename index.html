		<!-- Immediate Zero-Layout-Shift Theme Detector -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem("UNPAM_AGENDA_THEME");
					var isDark = stored
						? stored === "dark"
						: window.matchMedia &&
							window.matchMedia("(prefers-color-scheme: dark)")
								.matches;
					document.documentElement.setAttribute(
						"data-theme",
						isDark ? "dark" : "light",
					);
				} catch (e) {
					document.documentElement.setAttribute(
						"data-theme",
						"light",
					);
				}
			})();
		</script>
